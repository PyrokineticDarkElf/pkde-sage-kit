name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the secret scan reads the whole history
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install
        run: composer install --no-interaction --no-progress

      - name: Lint (Pint)
        run: composer lint

      - name: Test (Pest)
        run: composer test

      # The token generator's own tests (node:test): they run the real generator on a throwaway theme directory.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Test (token generator)
        run: |
          npm ci --no-audit --no-fund
          npm test

      # Public repository: no secrets in any commit, ever. Needs no token; runs on forks' pull requests too, which only get read access.
      - name: Secret scan (gitleaks, full history)
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact

      - name: Public-safety checks (no real emails, hosts, paths or keys)
        run: bash tests/public-safety.test.sh
